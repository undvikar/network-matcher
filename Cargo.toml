[package]
name = "matcher"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.pnet]
version="0.28.0"

[dependencies]

# Dependencies for redbpf
tokio = { version = "1.43", features = ["rt", "signal", "time", "io-util", "net", "sync"] }
tracing-subscriber = "0.2"
tracing = "0.1"
futures = "0.3"

# A pretty normal queue
queues = "1.1.0"
# Thread-safe hashmap
dashmap = "4.0.2"
# Ctrl-C handling
ctrlc = "3.4.5"
# For time and socket.recvfrom
nix = "0.23.2"
# Efficient Mutex
parking_lot = "0.11"
# Efficient channel
crossbeam-channel = "0.5"

# For socket creation
libc = "0.2"
# Command line argument parsing
clap = { version = "3.2.25", features = ["derive"] }
